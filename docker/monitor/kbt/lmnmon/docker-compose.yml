version: '3.3'
services:
  prometheus:
    build:
      context: .
      dockerfile: Dockerfile_prometheus
    container_name: Prometheus
    hostname: Prometheus
    restart: always
    networks:
      monitor_network:
        ipv4_address: 173.1.0.10
    ports:
      - '10.2.189.65:9090:9090'
    volumes:
      - ../.storage/prometheus/data:/prometheus:rw
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

networks:
  monitor_network:
    driver: bridge
    ipam:
      config:
        - subnet: 173.1.0.0/16
