version: '3.3'
services:
  sabal1_uat_db01:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: SabaL1UATDB01
    hostname: sabal1_uat_db01
    restart: always
    networks:
      sabal1uatdb_network:
        ipv4_address: 172.32.0.101
    ports:
      - '0.0.0.0:27251:27251'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ''
      MONGO_INITDB_ROOT_PASSWORD: ''
    volumes:
      - ../.storage/mongodbl101/db:/data/db:rw
      - ../.storage/mongodbl101/backup:/data/backup:rw
      - ../.storage/mongodbl101/log:/var/log/mongodb:rw
      - ./config/mongod.l1.pri.conf:/etc/mongod.conf:ro
    secrets:
      - keyFile
    command: --config /etc/mongod.conf --replSet SabaUAT --auth

secrets:
  keyFile:
    file: ./secret/keyFile

networks:
  sabal1uatdb_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.32.0.0/16