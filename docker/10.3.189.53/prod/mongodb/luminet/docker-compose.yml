version: '3.3'
services:
  saba_db02:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: SabaDB02
    hostname: saba_db02
    restart: always
    networks:
      sabadb_network:
        ipv4_address: 172.39.0.102
    ports:
      - '0.0.0.0:27102:27102'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ''
      MONGO_INITDB_ROOT_PASSWORD: ''
    volumes:
      - ../.storage/mongodb02/db:/data/db:rw
      - ../.storage/mongodb02/backup:/data/backup:rw
      - ../.storage/mongodb02/log:/var/log/mongodb:rw
      - ./config/mongod.sec.conf:/etc/mongod.conf:ro
    secrets:
      - keyFile
    command: --config /etc/mongod.conf --replSet SabaMain --auth

  saba_db03:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: SabaDB03
    hostname: saba_db03
    restart: always
    networks:
      sabadb_network:
        ipv4_address: 172.39.0.103
    ports:
      - '0.0.0.0:27103:27103'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ''
      MONGO_INITDB_ROOT_PASSWORD: ''
    volumes:
      - ../.storage/mongodb03/db:/data/db:rw
      - ../.storage/mongodb03/backup:/data/backup:rw
      - ../.storage/mongodb03/log:/var/log/mongodb:rw
      - ./config/mongod.arb.conf:/etc/mongod.conf:ro
    secrets:
      - keyFile
    command: --config /etc/mongod.conf --replSet SabaMain --auth

  saba_arc_db01:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: SabaArcDB01
    hostname: saba_arc_db01
    restart: always
    networks:
      sabadb_network:
        ipv4_address: 172.39.0.151
    ports:
      - '0.0.0.0:27151:27151'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ''
      MONGO_INITDB_ROOT_PASSWORD: ''
    volumes:
      - ../.storage/mongoarcdb01/db:/data/db:rw
      - ../.storage/mongoarcdb01/backup:/data/backup:rw
      - ../.storage/mongoarcdb01/log:/var/log/mongodb:rw
      - ./config/mongod.arc.conf:/etc/mongod.conf:ro
    secrets:
      - keyFile
    command: --config /etc/mongod.conf --auth

  saba_dbexporter02:
    build:
      context: .
      dockerfile: Dockerfile_exporter
    container_name: SabaDBExporter02
    hostname: saba_dbexporter02
    restart: always
    networks:
      sabadb_network:
        ipv4_address: 172.39.0.12
    ports:
      - '10.99.99.53:29102:9216'
    environment:
      MONGODB_URI: 'mongodb://mongodb_exporter:@172.39.0.102:27102/'
    command: --collect.database --collect.collection --collect.topmetrics --collect.indexusage --collect.connpoolstats

  saba_arc_dbexporter01:
    build:
      context: .
      dockerfile: Dockerfile_exporter
    container_name: SabaArcDBExporter01
    hostname: saba_arc_dbexporter01
    restart: always
    networks:
      sabadb_network:
        ipv4_address: 172.39.0.51
    ports:
      - '10.99.99.53:29151:9216'
    environment:
      MONGODB_URI: 'mongodb://@172.39.0.151:27151/'
    command: --collect.database --collect.collection --collect.topmetrics --collect.indexusage --collect.connpoolstats

  saba_bi02:
    build:
      context: .
      dockerfile: Dockerfile_mongobi
    container_name: SabaBI02
    hostname: saba_bi02
    restart: always
    networks:
      sabadb_network:
        ipv4_address: 172.39.0.22
    ports:
      - '10.99.99.53:28102:28102'
    volumes:
      - ../.storage/mongobi02/log:/var/log/mongosqld:rw
      - ./config/mongosqld.sec.conf:/etc/mongosqld.conf:ro

secrets:
  keyFile:
    file: ./secret/keyFile

networks:
  sabadb_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.39.0.0/16