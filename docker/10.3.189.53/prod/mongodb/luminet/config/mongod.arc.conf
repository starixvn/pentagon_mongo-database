systemLog:
  verbosity: 0
  destination: file
  path: '/var/log/mongodb/mongod.log'
  logAppend: true
  timeStampFormat: iso8601-utc
net:
  port: 27151
security:
  keyFile: /run/secrets/keyFile
  javascriptEnabled: true
storage:
  dbPath: /data/db
  journal:
    enabled: true
  directoryPerDB: true
  wiredTiger:
    engineConfig:
      cacheSizeGB: 3
operationProfiling:
  slowOpThresholdMs: 100
  mode: slowOp
replication:
  oplogSizeMB: 2048