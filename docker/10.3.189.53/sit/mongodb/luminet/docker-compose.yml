version: '3.3'
services:
  saba_sit_db01:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: SabaSITDB01
    hostname: saba_sit_db01
    restart: always
    networks:
      sabasitdb_network:
        ipv4_address: 172.35.0.101
    ports:
      - '0.0.0.0:27201:27201'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ''
      MONGO_INITDB_ROOT_PASSWORD: ''
    volumes:
      - ../.storage/mongodb01/db:/data/db:rw
      - ../.storage/mongodb01/backup:/data/backup:rw
      - ../.storage/mongodb01/log:/var/log/mongodb:rw
      - ./config/mongod.conf:/etc/mongod.conf:ro
    secrets:
      - keyFile
    command: --config /etc/mongod.conf --replSet SabaSIT --auth

  saba_sit_dbexporter01:
    build:
      context: .
      dockerfile: Dockerfile_exporter
    container_name: SabaSITDBExporter01
    hostname: saba_sit_dbexporter01
    restart: always
    networks:
      sabasitdb_network:
        ipv4_address: 172.35.0.11
    ports:
      - '10.99.99.53:29201:9216'
    environment:
      MONGODB_URI: 'mongodb://mongodb_exporter:@10.3.189.53:27201/'
    command: --collect.database --collect.collection --collect.topmetrics --collect.indexusage --collect.connpoolstats

secrets:
  keyFile:
    file: ./secret/keyFile
networks:
  sabasitdb_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.35.0.0/16