version: '3.3'
services:
  l3_saba_bk_db01:
    build:
      context: Dockerfile.d
      dockerfile: Dockerfile_mongod
    container_name: L3_SabaBKDB01
    hostname: l3_saba_bk_db01
    restart: always
    networks:
      l3_sabadb_network:
        ipv4_address: 172.39.116.75
    ports:
      - '0.0.0.0:47111:47111'
    environment:
      MONGO_INITDB_ROOT_USERNAME: 'root'
      MONGO_INITDB_ROOT_PASSWORD: '-'
    volumes:
      - ./.storage/l3_mongobkdb01/db:/data/db:rw
      - ./.storage/l3_mongobkdb01/log:/data/db/.log:rw
      - ./config/mongod.bk.conf:/etc/mongod.conf:ro
    secrets:
      - keyFile
    command: --config /etc/mongod.conf --replSet L3_SabaMain --auth
    security_opt:
      - 'seccomp=unconfined'

  l3_saba_db03:
    build:
      context: Dockerfile.d
      dockerfile: Dockerfile_mongod
    container_name: L3_SabaDB03
    hostname: l3_saba_db03
    restart: always
    networks:
      l3_sabadb_network:
        ipv4_address: 172.39.116.67
    ports:
      - '0.0.0.0:47103:47103'
    environment:
      MONGO_INITDB_ROOT_USERNAME: 'root'
      MONGO_INITDB_ROOT_PASSWORD: '-'
    volumes:
      - ./.storage/l3_mongodb03/db:/data/db:rw
      - ./.storage/l3_mongodb03/log:/data/db/.log:rw
      - ./config/mongod.arb.conf:/etc/mongod.conf:ro
    secrets:
      - keyFile
    command: --config /etc/mongod.conf --replSet L3_SabaMain --auth

secrets:
  keyFile:
    file: ./secret/keyFile

networks:
  l3_sabadb_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.39.96.0/19
