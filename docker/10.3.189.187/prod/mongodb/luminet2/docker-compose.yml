version: '3.3'
services:
  l2_saba_bk_db01:
    build:
      context: Dockerfile.d
      dockerfile: Dockerfile_mongod
    container_name: L2_SabaBKDB01
    hostname: l2_saba_bk_db01
    restart: always
    networks:
      l2_sabadb_network:
        ipv4_address: 172.39.84.75
    ports:
      - '0.0.0.0:37111:37111'
    environment:
      MONGO_INITDB_ROOT_USERNAME: 'root'
      MONGO_INITDB_ROOT_PASSWORD: '-'
    volumes:
      - ./.storage/l2_mongobkdb01/db:/data/db:rw
      - ./.storage/l2_mongobkdb01/log:/data/db/.log:rw
      - ./config/mongod.bk.conf:/etc/mongod.conf:ro
    secrets:
      - keyFile
    command: --config /etc/mongod.conf --replSet L2_SabaMain --auth
    security_opt:
      - 'seccomp=unconfined'

  l2_saba_db03:
    build:
      context: Dockerfile.d
      dockerfile: Dockerfile_mongod
    container_name: L2_SabaDB03
    hostname: l2_saba_db03
    restart: always
    networks:
      l2_sabadb_network:
        ipv4_address: 172.39.84.67
    ports:
      - '0.0.0.0:37103:37103'
    environment:
      MONGO_INITDB_ROOT_USERNAME: 'root'
      MONGO_INITDB_ROOT_PASSWORD: '-'
    volumes:
      - ./.storage/l2_mongodb03/db:/data/db:rw
      - ./.storage/l2_mongodb03/log:/data/db/.log:rw
      - ./config/mongod.arb.conf:/etc/mongod.conf:ro
    secrets:
      - keyFile
    command: --config /etc/mongod.conf --replSet L2_SabaMain --auth

secrets:
  keyFile:
    file: ./secret/keyFile

networks:
  l2_sabadb_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.39.64.0/19
