version: '3.3'
services:
  l1_saba_bk_db01:
    build:
      context: Dockerfile.d
      dockerfile: Dockerfile_mongod
    container_name: L1_SabaBKDB01
    hostname: l1_saba_bk_db01
    restart: always
    networks:
      l1_sabadb_network:
        ipv4_address: 172.39.52.75
    ports:
      - '0.0.0.0:27111:27111'
    environment:
      MONGO_INITDB_ROOT_USERNAME: 'root'
      MONGO_INITDB_ROOT_PASSWORD: '-'
    volumes:
      - ./.storage/l1_mongobkdb01/db:/data/db:rw
      - ./.storage/l1_mongobkdb01/log:/data/db/.log:rw
      - ./config/mongod.bk.conf:/etc/mongod.conf:ro
    secrets:
      - keyFile
    command: --config /etc/mongod.conf --replSet SabaMain --auth
    security_opt:
      - 'seccomp=unconfined'

  l1_saba_db03:
    build:
      context: Dockerfile.d
      dockerfile: Dockerfile_mongod
    container_name: L1_SabaDB03
    hostname: l1_saba_db03
    restart: always
    networks:
      l1_sabadb_network:
        ipv4_address: 172.39.52.67
    ports:
      - '0.0.0.0:27103:27103'
    environment:
      MONGO_INITDB_ROOT_USERNAME: 'root'
      MONGO_INITDB_ROOT_PASSWORD: '-'
    volumes:
      - ./.storage/l1_mongodb03/db:/data/db:rw
      - ./.storage/l1_mongodb03/log:/data/db/.log:rw
      - ./config/mongod.arb.conf:/etc/mongod.conf:ro
    secrets:
      - keyFile
    command: --config /etc/mongod.conf --replSet SabaMain --auth

secrets:
  keyFile:
    file: ./secret/keyFile

networks:
  l1_sabadb_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.39.32.0/19
