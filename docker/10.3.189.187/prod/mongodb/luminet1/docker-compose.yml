version: '3.3'
services:
  l1_saba_bk_db01:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: L1_SabaBKDB01
    hostname: l1_saba_bk_db01
    restart: always
    networks:
      l1_sabadb_network:
        ipv4_address: 172.39.27.111
    ports:
      - '0.0.0.0:27111:27111'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ''
      MONGO_INITDB_ROOT_PASSWORD: ''
    volumes:
      - ./.storage/l1_mongobkdb01/db:/data/db:rw
      - ./.storage/l1_mongobkdb01/backup:/data/backup:rw
      - ./.storage/l1_mongobkdb01/log:/var/log/mongodb:rw
      - ./config/mongod.bk.conf:/etc/mongod.conf:ro
    secrets:
      - keyFile
    command: --config /etc/mongod.conf --replSet SabaMain --auth
    security_opt:
      - 'seccomp=unconfined'

  l1_saba_lag_db01:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: L1_SabaLagDB01
    hostname: l1_saba_lag_db01
    restart: always
    networks:
      l1_sabadb_network:
        ipv4_address: 172.39.27.112
    ports:
      - '0.0.0.0:27112:27112'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ''
      MONGO_INITDB_ROOT_PASSWORD: ''
    volumes:
      - ./.storage/l1_mongolagdb01/db:/data/db:rw
      - ./.storage/l1_mongolagdb01/backup:/data/backup:rw
      - ./.storage/l1_mongolagdb01/log:/var/log/mongodb:rw
      - ./config/mongod.lag.conf:/etc/mongod.conf:ro
    secrets:
      - keyFile
    command: --config /etc/mongod.conf --replSet SabaMain --auth
    security_opt:
      - 'seccomp=unconfined'

secrets:
  keyFile:
    file: ./secret/keyFile

networks:
  l1_sabadb_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.39.27.0/24