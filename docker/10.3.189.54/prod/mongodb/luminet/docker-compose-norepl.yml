version: '3.3'
services:
  saba_db01:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: SabaDB01
    hostname: saba_db01
    restart: always
    networks:
      sabadb_network:
        ipv4_address: 172.39.0.101
    ports:
      - '0.0.0.0:27101:27101'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ''
      MONGO_INITDB_ROOT_PASSWORD: ''
    volumes:
      - ../.storage/mongodb01/db:/data/db:rw
      - ../.storage/mongodb01/backup:/data/backup:rw
      - ../.storage/mongodb01/log:/var/log/mongodb:rw
      - ./config/mongod.conf:/etc/mongod.conf:ro
    secrets:
      - keyFile
    command: --config /etc/mongod.conf
secrets:
  keyFile:
    file: ./secret/keyFile
networks:
  sabadb_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.39.0.0/16