version: '3.3'
services:
  saba_db01:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: SabaDB01
    hostname: saba_db01
    restart: always
    networks:
      sabadb_network:
        ipv4_address: 172.39.0.101
    ports:
      - '0.0.0.0:27101:27101'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ''
      MONGO_INITDB_ROOT_PASSWORD: ''
    volumes:
      - ../.storage/mongodb01/db:/data/db:rw
      - ../.storage/mongodb01/backup:/data/backup:rw
      - ../.storage/mongodb01/log:/var/log/mongodb:rw
      - ./config/mongod.pri.conf:/etc/mongod.conf:ro
    secrets:
      - keyFile
    command: --config /etc/mongod.conf --replSet SabaMain --auth

  saba_dbexporter01:
    build:
      context: .
      dockerfile: Dockerfile_exporter
    container_name: SabaDBExporter01
    hostname: saba_dbexporter01
    restart: always
    networks:
      sabadb_network:
        ipv4_address: 172.39.0.11
    ports:
      - '10.99.99.54:29101:9216'
    environment:
      MONGODB_URI: 'mongodb://mongodb_exporter:@172.39.0.101:27101/'
    command: --collect.database --collect.topmetrics --collect.connpoolstats

  saba_bi01:
    build:
      context: .
      dockerfile: Dockerfile_mongobi
    container_name: SabaBI01
    hostname: saba_bi01
    restart: always
    networks:
      sabadb_network:
        ipv4_address: 172.39.0.21
    ports:
      - '10.99.99.54:28101:28101'
    volumes:
      - ../.storage/mongobi01/log:/var/log/mongosqld:rw
      - ./config/mongosqld.pri.conf:/etc/mongosqld.conf:ro
    secrets:
      - mongosqld_ssl

secrets:
  keyFile:
    file: ./secret/keyFile
  mongosqld_ssl:
    file: ./secret/mongosqld.pem

networks:
  sabadb_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.39.0.0/16